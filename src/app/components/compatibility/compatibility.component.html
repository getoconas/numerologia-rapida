<div class="container">
  <br>
  <form>
    <label class="d-flex gap-2 justify-content-center" for="dtFecha1" style="margin-bottom: 5px;">
      Seleccione fecha 1 <input type="date" name="dtFecha1" [(ngModel)]="textDate1">
    </label>
    <label class="d-flex gap-2 justify-content-center" for="dtFecha2">
      Seleccione fecha 2 <input type="date" name="dtFecha2" [(ngModel)]="textDate2">
    </label>
    <br>
    <div class="d-flex gap-2 justify-content-center">
      <a [routerLink]="['../home']"><button type="button" class="btn btn-warning d-inline-flex">Volver a Inicio</button></a>
      <button type="button" class="btn btn-primary d-inline-flex" (click)="getCompatibility()">Buscar</button>
    </div>
  </form>
  <br>
  @if(viewResult) {
    <div class="flex-column justify-content-center mb-2">
      <div class="card text-center mb-2">
        <div class="card-body">
          <h5 class="card-title">Compatibilidad</h5>
          <p class="card-text">Compatibilidad entre {{ inputDate1 | date:'dd-MM-yyyy' }} = {{ first_number }} y {{ inputDate2 | date:'dd-MM-yyyy' }} = {{ second_number }}</p>
        </div>
      </div>
      <div class="card text-center">
        <div class="card-body">
          <p class="card-text">{{ description }}</p>
        </div>
      </div>
    </div>
  }
</div>
